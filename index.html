<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSFERA 2200 - Colônia Cascata</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #666688;
            font-size: 11px;
            background: rgba(10,10,15,0.7);
            padding: 3px 12px;
            border-radius: 6px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 1px;
            text-align: center;
        }
        .simple-hint {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: #4488ff;
            font-size: 12px;
            background: rgba(10,10,15,0.6);
            padding: 4px 16px;
            border-radius: 6px;
            pointer-events: none;
            border: 1px solid rgba(68,136,255,0.2);
            text-align: center;
            transition: all 0.3s;
        }
        .simple-hint.hack-active {
            color: #ffaa00;
            border-color: rgba(255,170,0,0.4);
            background: rgba(255,170,0,0.1);
        }
        @media (max-width: 600px) {
            #info { font-size: 9px; padding: 2px 8px; bottom: 5px; }
            .simple-hint { font-size: 10px; bottom: 45px; padding: 3px 10px; }
        }
    </style>
</head>
<body>

<div id="info">⚡ ECOSFERA 2200 — Colônia Cascata · Sobrevivência</div>
<div class="simple-hint" id="hint-text">🎮 WASD = Mover · E = Interagir · L = Loja · 1-5 = Plantas</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<script>
// ============================================================================
// 🌍 ECOSFERA 2200 – COLÔNIA CASCATA
// ============================================================================
// VERSÃO FINAL
// - Começa com 0 moedas e 5 milhos (recarga a cada 15s)
// - SUPERFÍCIE (antigo LAB)
// - Interface simplificada
// - Pá para deletar plantas
// - BOSS a cada 10 waves
// ============================================================================

// ============ ESTADO GLOBAL ============
let modo = "CHALE";
let moedas = 0;
let karma = 0;

// ============ RECARGA DE MILHO ============
let timerRecargaMilho = 0;
const TEMPO_RECARGA_MILHO = 15 * 60;

// ============ HACK ============
let hackContador = 0;
let hackTimer = 0;
let hackAtivado = false;
let hackCooldown = 0;

// ============ MOVIMENTO ============
let jogadorX = 400, jogadorY = 300;
let velocidadeJogador = 3;

// ============ INTERAÇÃO ============
let objetosChale = [
  { nome:"portaEsq", x:60,  y:240, w:50, h:80, tipo:"porta", destino:"FAZENDA", label:"🌱 ESTUFA", cor:[34,139,34] },
  { nome:"portaDir", x:690, y:240, w:50, h:80, tipo:"porta", destino:"PVZ",     label:"☢️ SUPERFÍCIE", cor:[139,69,19] },
  { nome:"pc",       x:350, y:90,  w:80, h:60, tipo:"pc",    label:"🛒 LOJA", cor:[0,100,200] }
];
let telaLojaAberta = false;
let lojaAba = "sementes";
let superficieLiberada = false;

// ============ LOJA ============
let sementesDisponiveis = {
  milho:   { nome:"🌽 Milho",   preco:30,  estoque:5, comprada:true, venda:12  },
  soja:    { nome:"🌱 Soja",    preco:80,  estoque:0, comprada:true, venda:45  },
  cenoura: { nome:"🥕 Cenoura", preco:80,  estoque:0, comprada:true, venda:45  },
  batata:  { nome:"🥔 Batata",  preco:300, estoque:0, comprada:true, venda:210 },
  tomate:  { nome:"🍅 Tomate",  preco:300, estoque:0, comprada:true, venda:210 }
};

let plantasDefesa = {
  girassol:     { nome:"🌻 Girassol",     preco:80,  comprada:false, custoSol:20,  funcao:"gerarSol"  },
  ervilha:      { nome:"🔫 Ervilha",      preco:80,  comprada:false, custoSol:40,  funcao:"atirar"    },
  cogumelo:     { nome:"🍄 Cogumelo",     preco:300, comprada:false, custoSol:70,  funcao:"lentidao"  },
  nozes:        { nome:"🥜 Nozes",        preco:500, comprada:false, custoSol:80,  funcao:"tanque"    },
  batataquente: { nome:"🔥 Batata Fogo",  preco:500, comprada:false, custoSol:400, funcao:"fogo"      }
};

// ============ FAZENDA ============
let fazendaGrid = [];
let linhasFaz = 3, colunasFaz = 4;
let celulaW, celulaH;
let offsetYFazenda = 100;

let culturasInfo = {
  milho:   { nome:"🌽 Milho",   tempo:80, venda:12,  desenho:desenharMilho   },
  soja:    { nome:"🌱 Soja",    tempo:100, venda:45,  desenho:desenharSoja    },
  cenoura: { nome:"🥕 Cenoura", tempo:60,  venda:45,  desenho:desenharCenoura },
  batata:  { nome:"🥔 Batata",  tempo:75,  venda:210, desenho:desenharBatata  },
  tomate:  { nome:"🍅 Tomate",  tempo:65,  venda:210, desenho:desenharTomate  }
};
let culturaSelecionada = "milho";

// ============ SUPERFÍCIE (PVZ) ============
let plantasPvZ = [];
let zumbisPvZ = [];
let projeteis = [];
let efeitosLentidao = [];
let efeitosFogo = [];
let sol = 100;
let wave = 1;
let zumbisRestantes = 0;
let tempoProxZumbi = 0;
let plantaSelecionada = null;
let linhasPvZ = 5, colunasPvZ = 5;
let colunasPlantaveis = 4, colunaSpawn = 4;
let celPvZW, celPvZH;
let offsetJardimY = 80;

let estadoJardim = "preparacao";
let tempoPreparacao = 300;
let zumbisMortosWave = 0;

// ============ PÁ ============
let modoPaAtivo = false;

// ============ BOSS ============
let bossAtivo = false;
let bossVida = 0;
let bossVidaMax = 0;
let bossDano = 0;
let bossVelocidade = 0;
let bossTimer = 0;

// ============ FEEDBACK ============
let feedbackMsg = "", tempoFeedback = 0;

// ============ SETUP ============
function setup() {
  createCanvas(800, 600);
  celPvZW = width / colunasPvZ;
  celPvZH = (height - offsetJardimY - 30) / linhasPvZ;
  celulaW = width / colunasFaz;
  celulaH = (height - offsetYFazenda - 50) / linhasFaz;
  resetarFazenda();
  resetarSuperficie();
  frameRate(60);
  document.getElementById('hint-text').textContent = '🎮 WASD = Mover · E = Interagir · L = Loja · 1-5 = Plantas';
}

function resetarSuperficie() {
  plantasPvZ = [];
  zumbisPvZ = [];
  projeteis = [];
  efeitosLentidao = [];
  efeitosFogo = [];
  sol = 100;
  wave = 1;
  zumbisRestantes = 2;
  plantaSelecionada = null;
  estadoJardim = "preparacao";
  tempoPreparacao = 300;
  zumbisMortosWave = 0;
  tempoProxZumbi = 0;
  bossAtivo = false;
  bossVida = 0;
  modoPaAtivo = false;
}

function resetarFazenda() {
  for (let i = 0; i < linhasFaz; i++) {
    fazendaGrid[i] = [];
    for (let j = 0; j < colunasFaz; j++) { fazendaGrid[i][j] = null; }
  }
}

// ============ DRAW ============
function draw() {
  // RECARGA DE MILHO
  timerRecargaMilho++;
  if (timerRecargaMilho >= TEMPO_RECARGA_MILHO) {
    timerRecargaMilho = 0;
    if (sementesDisponiveis.milho.estoque < 5) {
      sementesDisponiveis.milho.estoque = 5;
      feedback("🌽 Milho recarregado! (+5)", 40);
    }
  }
  
  // HACK
  if (hackTimer > 0) {
    hackTimer--;
    if (hackTimer === 0) hackContador = 0;
  }
  if (hackCooldown > 0) hackCooldown--;
  
  if (telaLojaAberta) { desenharLoja(); return; }

  if (modo === "CHALE") {
    desenharChale();
  } else if (modo === "FAZENDA") {
    desenharFazenda();
  } else if (modo === "PVZ") {
    desenharSuperficie();
  }
  
  if (hackAtivado) {
    let hint = document.getElementById('hint-text');
    hint.textContent = '🔥 HACK ATIVADO! +1000 MOEDAS!';
    hint.className = 'simple-hint hack-active';
    setTimeout(() => {
      hint.className = 'simple-hint';
      hint.textContent = '🎮 WASD = Mover · E = Interagir · L = Loja · 1-5 = Plantas';
      hackAtivado = false;
    }, 2000);
  }
  
  atualizarFeedback();
}

// ==================== CHALÉ ====================
function desenharChale() {
  background(30, 25, 20);
  
  fill(50, 40, 30);
  rect(0, 80, width, height-80);
  
  fill(60, 50, 40);
  rect(0, 0, width, 80);
  
  fill(0, 255, 136, 20);
  rect(40, 20, 80, 60);
  rect(width-120, 20, 80, 60);
  
  for (let obj of objetosChale) {
    if (obj.tipo === "porta" && obj.destino === "PVZ" && !superficieLiberada) {
      fill(80, 60, 50);
    } else {
      fill(obj.cor || [60, 50, 40]);
    }
    rect(obj.x, obj.y, obj.w, obj.h, 8);
    fill(200);
    textSize(14);
    textAlign(CENTER);
    text(obj.label, obj.x+obj.w/2, obj.y+obj.h-8);
  }
  
  desenharJogador(jogadorX, jogadorY);
  
  fill(0, 0, 0, 180);
  rect(0, 0, width, 45);
  fill(0, 255, 136);
  textSize(16);
  textAlign(LEFT);
  text(`💰 ${moedas}`, 15, 30);
  fill(150);
  textSize(12);
  text("🌿 Karma: " + karma, 100, 30);
  fill(200);
  textSize(12);
  text("🏠 BUNKER", width-120, 30);
  
  let segRestante = Math.ceil((TEMPO_RECARGA_MILHO - timerRecargaMilho) / 60);
  fill(150);
  textSize(10);
  textAlign(LEFT);
  text("🌽 Milho: " + sementesDisponiveis.milho.estoque + " | Recarga em " + segRestante + "s", 15, 45);
  
  if (hackContador > 0 && hackContador < 5) {
    fill(255, 170, 0, 150);
    textSize(10);
    textAlign(LEFT);
    text("🔑 " + hackContador + "/5", 15, 60);
  }
  
  if (keyIsDown(87)) jogadorY -= velocidadeJogador;
  if (keyIsDown(83)) jogadorY += velocidadeJogador;
  if (keyIsDown(65)) jogadorX -= velocidadeJogador;
  if (keyIsDown(68)) jogadorX += velocidadeJogador;
  jogadorX = constrain(jogadorX, 30, width-30);
  jogadorY = constrain(jogadorY, 90, height-40);
}

function desenharJogador(x, y) {
  push();
  translate(x, y);
  
  fill(70, 80, 90);
  rect(-12, -8, 24, 28, 6);
  
  fill(210, 180, 160);
  ellipse(0, -20, 26, 28);
  
  fill(50, 40, 30);
  arc(0, -24, 28, 14, PI, TWO_PI);
  
  fill(255);
  ellipse(-7, -22, 6, 7);
  ellipse(7, -22, 6, 7);
  fill(50, 40, 30);
  ellipse(-6, -21, 3, 4);
  ellipse(8, -21, 3, 4);
  fill(0);
  ellipse(-5, -20, 1.5, 2);
  ellipse(9, -20, 1.5, 2);
  
  stroke(150, 100, 80);
  strokeWeight(1.5);
  arc(0, -12, 8, 5, 0, PI);
  noStroke();
  
  fill(70, 80, 90);
  rect(-18, 0, 5, 18, 4);
  rect(13, 0, 5, 18, 4);
  
  fill(50, 60, 70);
  rect(-9, 18, 6, 16, 4);
  rect(3, 18, 6, 16, 4);
  
  fill(40, 30, 20);
  rect(-11, 32, 10, 6, 4);
  rect(1, 32, 10, 6, 4);
  
  pop();
}

// ==================== LOJA ====================
function desenharLoja() {
  background(15, 20, 30);
  fill(10, 15, 25, 200);
  rect(0, 0, width, height);
  
  fill(0, 255, 136);
  textSize(28);
  textAlign(CENTER);
  text("🛒 LOJA", width/2, 50);
  
  fill(200);
  textSize(16);
  text("💰 " + moedas + " créditos", width-120, 35);
  
  fill(200, 50, 50);
  rect(width-70, 15, 50, 30, 5);
  fill(255);
  textSize(14);
  text("FECHAR", width-45, 35);
  
  let abaY = 75;
  let abaW = 120;
  
  fill(lojaAba === "sementes" ? [34, 139, 34] : [50, 50, 60]);
  rect(width/2 - abaW - 10, abaY, abaW, 35, 5);
  fill(255);
  textSize(16);
  textAlign(CENTER);
  text("🌾 SEMENTES", width/2 - abaW - 10 + abaW/2, abaY+24);
  
  fill(lojaAba === "mutantes" ? [139, 69, 19] : [50, 50, 60]);
  rect(width/2 + 10, abaY, abaW, 35, 5);
  fill(255);
  text("🧬 MUTANTES", width/2 + 10 + abaW/2, abaY+24);
  
  let y = 130;
  let x = 50;
  
  if (lojaAba === "sementes") {
    fill(0, 255, 136);
    textSize(16);
    textAlign(LEFT);
    text("🌱 Compre sementes para a ESTUFA", x, y);
    y += 30;
    
    for (let [id, s] of Object.entries(sementesDisponiveis)) {
      if (!s.comprada) continue;
      fill(200);
      textSize(14);
      text(s.nome + " - $" + s.preco, x+10, y);
      fill(150);
      textSize(12);
      text("Estoque: " + s.estoque, x+180, y);
      
      let pode = moedas >= s.preco && s.estoque < 20;
      fill(pode ? [34, 139, 34] : [150, 50, 50]);
      rect(width-160, y-12, 100, 28, 5);
      fill(255);
      textSize(12);
      textAlign(CENTER);
      text(pode ? "COMPRAR" : s.estoque >= 20 ? "CHEIO" : "SEM $", width-110, y+6);
      y += 35;
    }
    
    fill(150);
    textSize(11);
    textAlign(LEFT);
    text("💡 Clique em COMPRAR para comprar 1 semente", x, y+10);
    
  } else {
    fill(0, 255, 136);
    textSize(16);
    textAlign(LEFT);
    text("🧬 Plantas mutantes para a SUPERFÍCIE", x, y);
    y += 30;
    
    let plantasLista = Object.entries(plantasDefesa);
    for (let [id, p] of plantasLista) {
      let status = p.comprada ? "✅ LIBERADA" : "🔒 $" + p.preco;
      fill(p.comprada ? [0, 200, 100] : [200, 150, 100]);
      textSize(14);
      text(p.nome, x+10, y);
      
      fill(150);
      textSize(12);
      text(status, x+160, y);
      
      if (!p.comprada) {
        let pode = moedas >= p.preco;
        fill(pode ? [34, 139, 34] : [150, 50, 50]);
        rect(width-160, y-12, 100, 28, 5);
        fill(255);
        textSize(12);
        textAlign(CENTER);
        text(pode ? "COMPRAR" : "SEM $", width-110, y+6);
      } else {
        fill([60, 60, 60]);
        rect(width-160, y-12, 100, 28, 5);
        fill(150);
        textSize(12);
        textAlign(CENTER);
        text("LIBERADA", width-110, y+6);
      }
      y += 35;
    }
    
    fill(150);
    textSize(11);
    textAlign(LEFT);
    text("💡 Compre pelo menos 1 para liberar a SUPERFÍCIE", x, y+10);
  }
  
  fill(100, 100, 120);
  textSize(11);
  textAlign(CENTER);
  text("Clique nas abas para trocar · Clique em COMPRAR para adquirir", width/2, height-25);
}

// ==================== FAZENDA ====================
function desenharFazenda() {
  background(30, 50, 30);
  
  fill(100, 180, 220);
  rect(0, 0, width, 80);
  fill(255, 220, 50);
  ellipse(60, 50, 40, 40);
  
  fill(60, 40, 20);
  rect(0, 80, width, height-80);
  
  fill(0, 0, 0, 180);
  rect(0, 0, width, 45);
  fill(0, 255, 136);
  textSize(16);
  textAlign(LEFT);
  text(`💰 ${moedas}`, 15, 30);
  fill(200);
  textSize(12);
  text("🌾 ESTUFA", width/2-40, 30);
  text("V = Voltar", width-100, 30);
  
  let semente = sementesDisponiveis[culturaSelecionada];
  if (semente && semente.comprada) {
    fill(255, 220, 50);
    textSize(14);
    textAlign(RIGHT);
    text(culturasInfo[culturaSelecionada].nome + " (Z/X)", width-20, 60);
    fill(200);
    textSize(12);
    text("Estoque: " + semente.estoque, width-20, 80);
  }
  
  for (let i = 0; i < linhasFaz; i++) {
    for (let j = 0; j < colunasFaz; j++) {
      let x = j * celulaW;
      let y = offsetYFazenda + i * celulaH;
      fill(80, 60, 30);
      rect(x, y, celulaW-2, celulaH-2, 5);
      fill(100, 80, 40);
      rect(x+2, y+2, celulaW-6, celulaH-6, 3);
      
      if (fazendaGrid[i][j]) {
        let p = fazendaGrid[i][j];
        let info = culturasInfo[p.tipo];
        let progresso = p.crescimento / info.tempo;
        push();
        translate(x + celulaW/2, y + celulaH/2);
        info.desenho(progresso);
        pop();
        fill(50);
        rect(x+5, y+5, celulaW-20, 5);
        fill(0, 255, 100);
        rect(x+5, y+5, (celulaW-20)*progresso, 5);
        if (progresso >= 1) {
          fill(255, 220, 50, 100);
          ellipse(x+celulaW/2, y+celulaH/2, 30, 30);
        }
      }
    }
  }
  
  if (frameCount % 3 === 0) {
    let taxa = 0.5 + (karma > 0 ? 0.3 : 0);
    for (let i = 0; i < linhasFaz; i++) {
      for (let j = 0; j < colunasFaz; j++) {
        if (fazendaGrid[i][j]) {
          fazendaGrid[i][j].crescimento += taxa;
          let maxC = culturasInfo[fazendaGrid[i][j].tipo].tempo;
          if (fazendaGrid[i][j].crescimento > maxC) { fazendaGrid[i][j].crescimento = maxC; }
        }
      }
    }
  }
}

// ==================== SUPERFÍCIE ====================
function desenharSuperficie() {
  if (!superficieLiberada) {
    modo = "CHALE";
    feedback("Compre uma planta mutante na Loja (L)!", 60);
    return;
  }
  
  background(20, 25, 35);
  
  // Grid
  for (let linha = 0; linha < linhasPvZ; linha++) {
    for (let col = 0; col < colunasPvZ; col++) {
      let x = col * celPvZW;
      let y = offsetJardimY + linha * celPvZH;
      fill(col < colunasPlantaveis ? color(30, 60, 30) : color(50, 40, 50));
      stroke(0, 255, 136, 20);
      rect(x, y, celPvZW, celPvZH);
      noStroke();
    }
  }
  
  // Plantas
  for (let p of plantasPvZ) {
    let x = p.col * celPvZW + celPvZW/2;
    let y = offsetJardimY + p.linha * celPvZH + celPvZH/2;
    desenharPlantaPvZ(p, x, y);
  }
  
  // Zumbis
  for (let z of zumbisPvZ) {
    desenharZumbi(z);
  }
  
  // BOSS
  if (bossAtivo) {
    desenharBoss();
  }
  
  // Projéteis
  for (let p of projeteis) {
    fill(0, 255, 100);
    ellipse(p.x, p.y, 6, 6);
  }
  
  // ===== HUD SUPER SIMPLES =====
  // Barra superior
  fill(0, 0, 0, 200);
  rect(0, 0, width, 35);
  
  // Informações básicas
  fill(0, 255, 136);
  textSize(14);
  textAlign(LEFT);
  text("☀️ " + sol + "  🌊 " + wave, 15, 24);
  
  fill(200);
  text("🧟 " + zumbisRestantes, 150, 24);
  
  // BOSS indicator
  if (bossAtivo) {
    fill(255, 50, 50);
    text("👾 BOSS!", 250, 24);
  }
  
  fill(200);
  text("V=Voltar", width-80, 24);
  
  // ===== MENU DE PLANTAS E PÁ =====
  let yMenu = 40;
  let plantasDisp = Object.keys(plantasDefesa).filter(id => plantasDefesa[id].comprada);
  
  // Fundo do menu
  fill(0, 0, 0, 150);
  rect(0, yMenu-5, width, 30);
  
  // Botões das plantas
  let xBtn = 10;
  for (let i = 0; i < plantasDisp.length && i < 5; i++) {
    let id = plantasDisp[i];
    let p = plantasDefesa[id];
    let selecionado = plantaSelecionada === id;
    fill(selecionado ? [0, 255, 136] : [60, 60, 80]);
    rect(xBtn, yMenu, 55, 24, 4);
    fill(255);
    textSize(11);
    textAlign(CENTER);
    text(p.nome, xBtn+27, yMenu+17);
    xBtn += 60;
  }
  
  // Botão da PÁ
  let paX = xBtn + 10;
  let paSelecionado = modoPaAtivo;
  fill(paSelecionado ? [255, 200, 0] : [80, 60, 40]);
  rect(paX, yMenu, 55, 24, 4);
  fill(255);
  textSize(14);
  textAlign(CENTER);
  text("🪏", paX+27, yMenu+18);
  
  // Status da PÁ
  if (modoPaAtivo) {
    fill(255, 200, 0);
    textSize(10);
    textAlign(CENTER);
    text("Clique na planta para remover", width/2, yMenu+32);
  }
  
  // Dica de teclas
  fill(100);
  textSize(9);
  textAlign(LEFT);
  text("1-5: Plantas  |  P: Pá", 10, yMenu+48);
  
  // Estado da wave
  if (estadoJardim === "preparacao") {
    let seg = ceil(tempoPreparacao / 60);
    fill(255, 200, 100);
    textSize(14);
    textAlign(CENTER);
    text("⚔️ PRÓXIMA WAVE EM " + seg + "s", width/2, height-20);
  } else {
    fill(255, 100, 100);
    textSize(14);
    textAlign(CENTER);

}

// ==================== LÓGICA DA SUPERFÍCIE ====================
function atualizarSuperficie() {
  // Preparação
  if (estadoJardim === "preparacao") {
    tempoPreparacao--;
    if (tempoPreparacao <= 0) {
      estadoJardim = "combate";
      
      // VERIFICA BOSS (a cada 10 waves)
      let isBossWave = (wave % 10 === 0);
      
      if (isBossWave) {
        // BOSS!
        bossAtivo = true;
        let linha = floor(random(linhasPvZ));
        let x = colunaSpawn * celPvZW + celPvZW/2;
        let y = offsetJardimY + linha * celPvZH + celPvZH/2;
        
        bossVidaMax = 500 + wave * 50;
        bossVida = bossVidaMax;
        bossDano = 30 + wave * 3;
        bossVelocidade = 0.4 + wave * 0.02;
        
        let bossZumbi = {
          x: x, y: y, linha: linha,
          vida: bossVida, vidaMax: bossVidaMax,
          velocidade: bossVelocidade,
          timerAtaque: 0,
          dano: bossDano,
          tipo: "boss",
          queimando: false,
          isBoss: true
        };
        zumbisPvZ.push(bossZumbi);
        zumbisRestantes = 1;
        feedback("👾 BOSS APARECEU! Wave " + wave + "!", 90);
      } else {
        zumbisRestantes = 2 + wave * 1;
      }
      zumbisMortosWave = 0;
      tempoProxZumbi = 0;
    }
    return;
  }
  
  // Spawn de zumbis (exceto BOSS)
  if (!bossAtivo && zumbisRestantes > 0 && frameCount > tempoProxZumbi) {
    let linha = floor(random(linhasPvZ));
    let tipos = ["padrao"];
    if (wave >= 3) tipos.push("cone");
    if (wave >= 5) tipos.push("balde");
    if (wave >= 8) tipos.push("zumbinho");
    if (wave >= 12) tipos.push("escudeiro");
    let tipo = tipos[floor(random(tipos.length))];
    
    let vida = 40 + wave * 8;
    let dano = 8 + wave * 2;
    let vel = 0.5 + wave * 0.05;
    
    if (tipo === "cone") { vida *= 1.5; dano *= 1.2; }
    if (tipo === "balde") { vida *= 2; dano *= 1.3; vel *= 0.8; }
    if (tipo === "zumbinho") { vida *= 0.5; dano *= 0.7; vel *= 1.8; }
    if (tipo === "escudeiro") { vida *= 3; dano *= 1; vel *= 0.5; }
    
    let x = colunaSpawn * celPvZW + celPvZW/2;
    let y = offsetJardimY + linha * celPvZH + celPvZH/2;
    
    zumbisPvZ.push({
      x: x, y: y, linha: linha,
      vida: vida, vidaMax: vida,
      velocidade: vel,
      timerAtaque: 0,
      dano: dano,
      tipo: tipo,
      queimando: false,
      isBoss: false
    });
    
    zumbisRestantes--;
    tempoProxZumbi = frameCount + 60 + random(30);
  }
  
  // Plantas atacam
  for (let p of plantasPvZ) {
    if (p.tipo === "girassol") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 200) {
        sol += 15 + (p.nivel || 0) * 5;
        p.timer = 0;
      }
    }
    
    if (p.tipo === "ervilha") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 25) {
        let alvo = zumbisPvZ.find(z => z.linha === p.linha);
        if (alvo) {
          projeteis.push({
            x: p.col * celPvZW + celPvZW/2 + 15,
            y: offsetJardimY + p.linha * celPvZH + celPvZH/2,
            linha: p.linha,
            dano: 15 + (p.nivel || 0) * 5
          });
          p.timer = 0;
        }
      }
    }
    
    if (p.tipo === "cogumelo") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 60) {
        let alvo = zumbisPvZ.find(z => z.linha === p.linha);
        if (alvo) {
          alvo.velocidade *= 0.5;
          setTimeout(() => { alvo.velocidade *= 2; }, 3000);
          projeteis.push({
            x: p.col * celPvZW + celPvZW/2 + 15,
            y: offsetJardimY + p.linha * celPvZH + celPvZH/2,
            linha: p.linha,
            dano: 5
          });
          p.timer = 0;
        }
      }
    }
    
    if (p.tipo === "batataquente") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 200) {
        let alvo = zumbisPvZ.find(z => z.linha === p.linha);
        if (alvo) {
          projeteis.push({
            x: p.col * celPvZW + celPvZW/2 + 15,
            y: offsetJardimY + p.linha * celPvZH + celPvZH/2,
            linha: p.linha,
            dano: 30 + (p.nivel || 0) * 10,
            fogo: true
          });
          p.timer = 0;
        }
      }
    }
  }
  
  // Projéteis
  for (let i = projeteis.length - 1; i >= 0; i--) {
    let p = projeteis[i];
    p.x += 6;
    let hit = false;
    for (let z of zumbisPvZ) {
      if (z.linha === p.linha && abs(p.x - z.x) < 25 && abs(p.y - z.y) < 20) {
        z.vida -= p.dano;
        if (p.fogo) {
          z.queimando = true;
          z.vida -= 30;
          setTimeout(() => { z.queimando = false; }, 2000);
        }
        hit = true;
        break;
      }
    }
    if (hit || p.x > width) { projeteis.splice(i, 1); }
  }
  
  // Zumbis se movem
  for (let i = zumbisPvZ.length - 1; i >= 0; i--) {
    let z = zumbisPvZ[i];
    let bloqueado = false;
    
    for (let p of plantasPvZ) {
      if (p.linha === z.linha) {
        let plantaX = p.col * celPvZW + celPvZW/2;
        if (abs(z.x - plantaX) < 30) {
          bloqueado = true;
          if (z.timerAtaque <= 0) {
            p.vida -= z.dano;
            z.timerAtaque = 20;
            if (p.vida <= 0) {
              let idx = plantasPvZ.indexOf(p);
              if (idx > -1) { plantasPvZ.splice(idx, 1); }
            }
          }
          break;
        }
      }
    }
    
    if (!bloqueado) {
      z.x -= z.velocidade;
    }
    
    if (z.timerAtaque > 0) { z.timerAtaque--; }
    
    if (z.queimando) {
      z.vida -= 1;
    }
    
    if (z.vida <= 0) {
      // BOSS morreu!
      if (z.isBoss) {
        bossAtivo = false;
        moedas += 200 + wave * 20;
        sol += 100;
        feedback("👾 BOSS DERROTADO! +" + (200 + wave * 20) + " moedas!", 90);
      } else {
        moedas += 5 + wave * 2;
      }
      zumbisPvZ.splice(i, 1);
      zumbisMortosWave++;
    }
  }
  
  // Fim da wave
  let totalZumbisWave = (wave % 10 === 0) ? 1 : (2 + wave * 1);
  if (zumbisPvZ.length === 0 && zumbisMortosWave >= totalZumbisWave) {
    wave++;
    estadoJardim = "preparacao";
    tempoPreparacao = 200;
    sol += 30;
    if (!bossAtivo) {
      moedas += 20 + wave * 5;
      feedback("🌊 Wave " + (wave-1) + " completa! +" + (20 + wave * 5) + " moedas", 60);
    }
    bossAtivo = false;
  }
}

// ==================== EVENTOS ====================
function keyPressed() {
  // ===== HACK =====
  if (key === 'p' || key === 'P') {
    if (hackCooldown <= 0) {
      hackContador++;
      hackTimer = 180;
      if (hackContador >= 5) {
        moedas += 1000;
        hackAtivado = true;
        hackContador = 0;
        hackTimer = 0;
        hackCooldown = 300;
        feedback("🔥 HACK ATIVADO! +1000 MOEDAS!", 90);
        return;
      }
      feedback("🔑 " + hackContador + "/5", 60);
    } else {
      feedback("⏳ Hack em cooldown...", 30);
    }
    return;
  }
  
  // ===== PÁ =====
  if (key === 'P' && modo === "PVZ") {
    if (key === 'p' || key === 'P') {
      // Já tratado acima para o hack
    }
  }
  
  // Tecla P (pá) - no modo PVZ
  if (key === 'p' && modo === "PVZ") {
    // A tecla P já é usada para o hack, então usamos outra tecla para a pá
    // Vamos usar a tecla "G" para pá (de "Gardening" ou "Pá" em português)
  }
  
  // Usamos a tecla "G" para a Pá (para não conflitar com o hack)
  if ((key === 'g' || key === 'G') && modo === "PVZ") {
    modoPaAtivo = !modoPaAtivo;
    if (modoPaAtivo) {
      feedback("🪏 Modo Pá ATIVADO! Clique em uma planta para removê-la.", 60);
      plantaSelecionada = null;
    } else {
      feedback("🪏 Modo Pá DESATIVADO.", 40);
    }
    return;
  }
  
  // Fechar loja
  if (telaLojaAberta) {
    if (key === 'e' || key === 'E' || key === 'Escape') {
      telaLojaAberta = false;
    }
    return;
  }
  
  // Loja (L)
  if (key === 'l' || key === 'L') {
    telaLojaAberta = true;
    return;
  }
  
  // Voltar (V)
  if (key === 'v' || key === 'V') {
    if (modo !== "CHALE") {
      modo = "CHALE";
      modoPaAtivo = false;
      document.getElementById('hint-text').textContent = '🎮 WASD = Mover · E = Interagir · L = Loja · 1-5 = Plantas';
    }
    return;
  }
  
  // Interagir (E) - no chalé
  if (modo === "CHALE" && (key === 'e' || key === 'E')) {
    let rectJogador = { x: jogadorX-15, y: jogadorY-15, w: 30, h: 30 };
    for (let obj of objetosChale) {
      if (colide(rectJogador, obj)) {
        if (obj.tipo === "porta") {
          if (obj.destino === "PVZ" && !superficieLiberada) {
            feedback("Compre uma planta mutante na Loja (L)!", 60);
            return;
          }
          modo = obj.destino;
          if (modo === "PVZ") { resetarSuperficie(); }
          document.getElementById('hint-text').textContent = '🌱 1-5 Plantas · G = Pá · V = Voltar';
        } else if (obj.tipo === "pc") {
          telaLojaAberta = true;
        }
        break;
      }
    }
    return;
  }
  
  // Seleção de cultura (Z/X) - fazenda
  if (modo === "FAZENDA") {
    let culturas = Object.keys(culturasInfo);
    if (key === 'z' || key === 'Z') {
      let idx = culturas.indexOf(culturaSelecionada);
      idx = (idx + 1) % culturas.length;
      culturaSelecionada = culturas[idx];
    }
    if (key === 'x' || key === 'X') {
      let idx = culturas.indexOf(culturaSelecionada);
      idx = (idx - 1 + culturas.length) % culturas.length;
      culturaSelecionada = culturas[idx];
    }
  }
  
  // Seleção de planta (1-5) - superfície
  if (modo === "PVZ") {
    let plantasDisp = Object.keys(plantasDefesa).filter(id => plantasDefesa[id].comprada);
    for (let i = 0; i < plantasDisp.length && i < 5; i++) {
      if (key === String(i+1)) {
        if (modoPaAtivo) {
          feedback("🪏 Desative a Pá primeiro (G) para selecionar plantas.", 40);
          return;
        }
        plantaSelecionada = plantasDisp[i];
        feedback("✅ " + plantasDefesa[plantaSelecionada].nome + " selecionada", 30);
      }
    }
  }
}

function mousePressed() {
  // ===== LOJA =====
  if (telaLojaAberta) {
    if (mouseX > width-70 && mouseX < width-20 && mouseY > 15 && mouseY < 45) {
      telaLojaAberta = false;
      return;
    }
    
    let abaY = 75;
    let abaW = 120;
    
    if (mouseX > width/2 - abaW - 10 && mouseX < width/2 - 10 && mouseY > abaY && mouseY < abaY + 35) {
      lojaAba = "sementes";
      return;
    }
    
    if (mouseX > width/2 + 10 && mouseX < width/2 + 10 + abaW && mouseY > abaY && mouseY < abaY + 35) {
      lojaAba = "mutantes";
      return;
    }
    
    if (lojaAba === "sementes") {
      let y = 160;
      for (let [id, s] of Object.entries(sementesDisponiveis)) {
        if (!s.comprada) { y += 35; continue; }
        let botaoX = width-160;
        if (mouseX > botaoX && mouseX < botaoX+100 && mouseY > y-12 && mouseY < y+16) {
          if (moedas >= s.preco && s.estoque < 20) {
            moedas -= s.preco;
            s.estoque++;
            feedback("✅ Comprou " + s.nome, 30);
          } else if (s.estoque >= 20) {
            feedback("❌ Estoque cheio!", 30);
          } else {
            feedback("❌ Sem créditos!", 30);
          }
          return;
        }
        y += 35;
      }
    } else {
      let y = 160;
      for (let [id, p] of Object.entries(plantasDefesa)) {
        if (p.comprada) { y += 35; continue; }
        let botaoX = width-160;
        if (mouseX > botaoX && mouseX < botaoX+100 && mouseY > y-12 && mouseY < y+16) {
          if (moedas >= p.preco) {
            moedas -= p.preco;
            p.comprada = true;
            superficieLiberada = true;
            feedback("✅ " + p.nome + " desbloqueada! Acesse a SUPERFÍCIE!", 60);
          } else {
            feedback("❌ Sem créditos!", 30);
          }
          return;
        }
        y += 35;
      }
    }
    return;
  }
  
  // ===== FAZENDA =====
  if (modo === "FAZENDA") {
    for (let i = 0; i < linhasFaz; i++) {
      for (let j = 0; j < colunasFaz; j++) {
        let x = j * celulaW;
        let y = offsetYFazenda + i * celulaH;
        if (mouseX > x && mouseX < x+celulaW && mouseY > y && mouseY < y+celulaH) {
          if (fazendaGrid[i][j]) {
            let p = fazendaGrid[i][j];
            if (p.crescimento >= culturasInfo[p.tipo].tempo) {
              let valor = culturasInfo[p.tipo].venda;
              moedas += valor;
              fazendaGrid[i][j] = null;
              feedback("💰 +" + valor + " moedas", 30);
            } else {
              feedback("⏳ Ainda não cresceu!", 30);
            }
          } else {
            let s = sementesDisponiveis[culturaSelecionada];
            if (s && s.comprada && s.estoque > 0) {
              fazendaGrid[i][j] = { tipo: culturaSelecionada, crescimento: 0 };
              s.estoque--;
              feedback("🌱 Plantou " + culturasInfo[culturaSelecionada].nome, 30);
            } else {
              feedback("❌ Sem sementes!", 30);
            }
          }
          return;
        }
      }
    }
  }
  
  // ===== SUPERFÍCIE =====
  if (modo === "PVZ") {
    let col = floor(mouseX / celPvZW);
    let linha = floor((mouseY - offsetJardimY) / celPvZH);
    
    // Verifica se o clique está dentro da área plantável
    if (col >= 0 && col < colunasPlantaveis && linha >= 0 && linha < linhasPvZ) {
      
      // ===== MODO PÁ =====
      if (modoPaAtivo) {
        let idx = plantasPvZ.findIndex(p => p.linha === linha && p.col === col);
        if (idx !== -1) {
          let planta = plantasPvZ[idx];
          let custoOriginal = plantasDefesa[planta.tipo] ? plantasDefesa[planta.tipo].custoSol : 0;
          let devolucao = Math.floor(custoOriginal * 0.3);
          sol += devolucao;
          plantasPvZ.splice(idx, 1);
          feedback("🗑️ Planta removida! +" + devolucao + " sol", 40);
        } else {
          feedback("🪏 Nenhuma planta aqui para remover.", 30);
        }
        return;
      }
      
      // ===== PLANTAR =====
      if (!plantaSelecionada) {
        feedback("❌ Selecione uma planta (1-5)!", 30);
        return;
      }
      
      let plantaData = plantasDefesa[plantaSelecionada];
      if (!plantaData || !plantaData.comprada) {
        feedback("❌ Esta planta não está liberada!", 30);
        return;
      }
      
      let ocupado = plantasPvZ.some(p => p.linha === linha && p.col === col);
      if (ocupado) {
        feedback("❌ Local ocupado!", 30);
        return;
      }
      
      if (sol < plantaData.custoSol) {
        feedback("☀️ Sol insuficiente! (" + plantaData.custoSol + " necessário)", 30);
        return;
      }
      
      let vida = 50;
      if (plantaSelecionada === "nozes") vida = 200;
      if (plantaSelecionada === "batataquente") vida = 60;
      
      plantasPvZ.push({
        tipo: plantaSelecionada,
        linha: linha,
        col: col,
        vida: vida,
        vidaMax: vida,
        timer: 0,
        nivel: 0
      });
      
      sol -= plantaData.custoSol;
      feedback("✅ " + plantaData.nome + " plantada! (Sol: " + sol + ")", 30);
    } else {
      feedback("🌱 Clique na área verde para plantar", 30);
    }
  }
}

function colide(r1, r2) {
  return r1.x < r2.x+r2.w && r1.x+r1.w > r2.x && 
         r1.y < r2.y+r2.h && r1.y+r1.h > r2.y;
}
</script>
