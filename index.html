<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSFERA 2200 - Colônia Cascata</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #666688;
            font-size: 11px;
            background: rgba(10,10,15,0.7);
            padding: 3px 12px;
            border-radius: 6px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 1px;
            text-align: center;
        }
        .simple-hint {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: #4488ff;
            font-size: 12px;
            background: rgba(10,10,15,0.6);
            padding: 4px 16px;
            border-radius: 6px;
            pointer-events: none;
            border: 1px solid rgba(68,136,255,0.2);
            text-align: center;
        }
        @media (max-width: 600px) {
            #info { font-size: 9px; padding: 2px 8px; bottom: 5px; }
            .simple-hint { font-size: 10px; bottom: 45px; padding: 3px 10px; }
        }
    </style>
</head>
<body>

<div id="info">⚡ ECOSFERA 2200 — Colônia Cascata · Sobrevivência</div>
<div class="simple-hint" id="hint-text">🎮 WASD = Mover · E = Interagir · Clique = Plantar/Colher</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<script>
// ============================================================================
// 🌍 ECOSFERA 2200 – COLÔNIA CASCATA
// ============================================================================
// VERSÃO SIMPLES E EQUILIBRADA
// - Plantas naturais (estilo Fazenda Cascata)
// - Mutantes mantidos (tema pós-apocalíptico)
// - Interface simplificada para crianças
// - Equilíbrio: plantas baratas, mutantes mais lentos
// ============================================================================

// ============ ESTADO GLOBAL ============
let modo = "CHALE";
let moedas = 100;
let karma = 0;

// ============ MOVIMENTO ============
let jogadorX = 400, jogadorY = 300;
let velocidadeJogador = 3;

// ============ INTERAÇÃO ============
let objetosChale = [
  { nome:"portaEsq", x:60,  y:240, w:50, h:80, tipo:"porta", destino:"FAZENDA", label:"🌱 ESTUFA", cor:[34,139,34] },
  { nome:"portaDir", x:690, y:240, w:50, h:80, tipo:"porta", destino:"PVZ",     label:"🧬 LAB", cor:[139,69,19] },
  { nome:"pc",       x:350, y:90,  w:80, h:60, tipo:"pc",    label:"🛒 LOJA", cor:[0,100,200] }
];
let telaLojaAberta = false;
let jardimLiberado = false;

// ============ LOJA ============
let sementesDisponiveis = {
  milho:   { nome:"🌽 Milho",   preco:30,  estoque:5, comprada:true, venda:12  },
  soja:    { nome:"🌱 Soja",    preco:80,  estoque:5, comprada:true, venda:45  },
  cenoura: { nome:"🥕 Cenoura", preco:80,  estoque:5, comprada:true, venda:45  },
  batata:  { nome:"🥔 Batata",  preco:300, estoque:3, comprada:true, venda:210 },
  tomate:  { nome:"🍅 Tomate",  preco:300, estoque:3, comprada:true, venda:210 }
};

let plantasDefesa = {
  girassol:     { nome:"🌻 Girassol",     preco:80,  comprada:false, custoSol:20,  funcao:"gerarSol"  },
  ervilha:      { nome:"🔫 Ervilha",      preco:80,  comprada:false, custoSol:40,  funcao:"atirar"    },
  cogumelo:     { nome:"🍄 Cogumelo",     preco:300, comprada:false, custoSol:70,  funcao:"lentidao"  },
  nozes:        { nome:"🥜 Nozes",        preco:500, comprada:false, custoSol:80,  funcao:"tanque"    },
  batataquente: { nome:"🔥 Batata Fogo",  preco:500, comprada:false, custoSol:400, funcao:"fogo"      }
};

// ============ FAZENDA ============
let fazendaGrid = [];
let linhasFaz = 3, colunasFaz = 4;
let celulaW, celulaH;
let offsetYFazenda = 100;

let culturasInfo = {
  milho:   { nome:"🌽 Milho",   tempo:80, venda:12,  desenho:desenharMilho   },
  soja:    { nome:"🌱 Soja",    tempo:100, venda:45,  desenho:desenharSoja    },
  cenoura: { nome:"🥕 Cenoura", tempo:60,  venda:45,  desenho:desenharCenoura },
  batata:  { nome:"🥔 Batata",  tempo:75,  venda:210, desenho:desenharBatata  },
  tomate:  { nome:"🍅 Tomate",  tempo:65,  venda:210, desenho:desenharTomate  }
};
let culturaSelecionada = "milho";

// ============ JARDIM (PVZ) ============
let plantasPvZ = [];
let zumbisPvZ = [];
let projeteis = [];
let efeitosLentidao = [];
let efeitosFogo = [];
let sol = 100;
let wave = 1;
let zumbisRestantes = 0;
let tempoProxZumbi = 0;
let plantaSelecionada = null;
let linhasPvZ = 5, colunasPvZ = 5;
let colunasPlantaveis = 4, colunaSpawn = 4;
let celPvZW, celPvZH;
let offsetJardimY = 80;

let estadoJardim = "preparacao";
let tempoPreparacao = 300;
let zumbisMortosWave = 0;

// ============ FEEDBACK ============
let feedbackMsg = "", tempoFeedback = 0;

// ============ SETUP ============
function setup() {
  createCanvas(800, 600);
  celPvZW = width / colunasPvZ;
  celPvZH = (height - offsetJardimY - 30) / linhasPvZ;
  celulaW = width / colunasFaz;
  celulaH = (height - offsetYFazenda - 50) / linhasFaz;
  resetarFazenda();
  resetarJardim();
  frameRate(60);
  document.getElementById('hint-text').textContent = '🎮 WASD = Mover · E = Interagir · Clique = Plantar/Colher';
}

function resetarJardim() {
  plantasPvZ = [];
  zumbisPvZ = [];
  projeteis = [];
  efeitosLentidao = [];
  efeitosFogo = [];
  sol = 100;
  wave = 1;
  zumbisRestantes = 2;
  plantaSelecionada = null;
  estadoJardim = "preparacao";
  tempoPreparacao = 300;
  zumbisMortosWave = 0;
  tempoProxZumbi = 0;
}

function resetarFazenda() {
  for (let i = 0; i < linhasFaz; i++) {
    fazendaGrid[i] = [];
    for (let j = 0; j < colunasFaz; j++) { fazendaGrid[i][j] = null; }
  }
}

// ============ DRAW ============
function draw() {
  if (telaLojaAberta) { desenharLoja(); return; }

  if (modo === "CHALE") {
    desenharChale();
  } else if (modo === "FAZENDA") {
    desenharFazenda();
  } else if (modo === "PVZ") {
    desenharJardim();
  }
  
  atualizarFeedback();
}

// ==================== CHALÉ ====================
function desenharChale() {
  background(30, 25, 20);
  
  // Piso
  fill(50, 40, 30);
  rect(0, 80, width, height-80);
  
  // Paredes
  fill(60, 50, 40);
  rect(0, 0, width, 80);
  
  // Luzes
  fill(0, 255, 136, 20);
  rect(40, 20, 80, 60);
  rect(width-120, 20, 80, 60);
  
  // Objetos
  for (let obj of objetosChale) {
    if (obj.tipo === "porta" && obj.destino === "PVZ" && !jardimLiberado) {
      fill(80, 60, 50);
    } else {
      fill(obj.cor || [60, 50, 40]);
    }
    rect(obj.x, obj.y, obj.w, obj.h, 8);
    fill(200);
    textSize(14);
    textAlign(CENTER);
    text(obj.label, obj.x+obj.w/2, obj.y+obj.h-8);
  }
  
  // Jogador
  desenharJogador(jogadorX, jogadorY);
  
  // HUD
  fill(0, 0, 0, 180);
  rect(0, 0, width, 45);
  fill(0, 255, 136);
  textSize(16);
  textAlign(LEFT);
  text(`💰 ${moedas}`, 15, 30);
  fill(150);
  textSize(12);
  text("🌿 Karma: " + karma, 100, 30);
  fill(200);
  textSize(12);
  text("🏠 BUNKER", width-120, 30);
  
  // Movimento
  if (keyIsDown(87)) jogadorY -= velocidadeJogador;
  if (keyIsDown(83)) jogadorY += velocidadeJogador;
  if (keyIsDown(65)) jogadorX -= velocidadeJogador;
  if (keyIsDown(68)) jogadorX += velocidadeJogador;
  jogadorX = constrain(jogadorX, 30, width-30);
  jogadorY = constrain(jogadorY, 90, height-40);
}

function desenharJogador(x, y) {
  push();
  translate(x, y);
  
  // Corpo
  fill(70, 80, 90);
  rect(-12, -8, 24, 28, 6);
  
  // Cabeça
  fill(210, 180, 160);
  ellipse(0, -20, 26, 28);
  
  // Cabelo
  fill(50, 40, 30);
  arc(0, -24, 28, 14, PI, TWO_PI);
  
  // Olhos
  fill(255);
  ellipse(-7, -22, 6, 7);
  ellipse(7, -22, 6, 7);
  fill(50, 40, 30);
  ellipse(-6, -21, 3, 4);
  ellipse(8, -21, 3, 4);
  fill(0);
  ellipse(-5, -20, 1.5, 2);
  ellipse(9, -20, 1.5, 2);
  
  // Boca (sorrindo)
  stroke(150, 100, 80);
  strokeWeight(1.5);
  arc(0, -12, 8, 5, 0, PI);
  noStroke();
  
  // Braços
  fill(70, 80, 90);
  rect(-18, 0, 5, 18, 4);
  rect(13, 0, 5, 18, 4);
  
  // Pernas
  fill(50, 60, 70);
  rect(-9, 18, 6, 16, 4);
  rect(3, 18, 6, 16, 4);
  
  // Botas
  fill(40, 30, 20);
  rect(-11, 32, 10, 6, 4);
  rect(1, 32, 10, 6, 4);
  
  pop();
}

// ==================== LOJA ====================
function desenharLoja() {
  background(15, 20, 30);
  fill(10, 15, 25, 200);
  rect(0, 0, width, height);
  
  fill(0, 255, 136);
  textSize(28);
  textAlign(CENTER);
  text("🛒 LOJA", width/2, 60);
  
  fill(200);
  textSize(16);
  text("💰 " + moedas + " créditos", width-120, 40);
  
  // Fechar
  fill(200, 50, 50);
  rect(width-70, 20, 50, 30, 5);
  fill(255);
  textSize(14);
  text("FECHAR", width-45, 40);
  
  let y = 100;
  let x = 50;
  
  // Sementes
  fill(0, 255, 136);
  textSize(18);
  textAlign(LEFT);
  text("🌾 SEMENTES", x, y);
  y += 30;
  
  for (let [id, s] of Object.entries(sementesDisponiveis)) {
    if (!s.comprada) continue;
    fill(200);
    textSize(14);
    text(s.nome + " - $" + s.preco + " (estoque: " + s.estoque + ")", x+10, y);
    
    let pode = moedas >= s.preco && s.estoque < 20;
    fill(pode ? [34, 139, 34] : [150, 50, 50]);
    rect(width-160, y-12, 100, 28, 5);
    fill(255);
    textSize(12);
    textAlign(CENTER);
    text(pode ? "COMPRAR" : s.estoque >= 20 ? "CHEIO" : "SEM $", width-110, y+6);
    y += 35;
  }
  
  y += 20;
  
  // Plantas Defensivas
  fill(0, 255, 136);
  textSize(18);
  textAlign(LEFT);
  text("🧬 PLANTAS MUTANTES", x, y);
  y += 30;
  
  for (let [id, p] of Object.entries(plantasDefesa)) {
    fill(p.comprada ? [0, 200, 100] : [200, 100, 50]);
    textSize(14);
    text(p.nome + (p.comprada ? " ✅" : " - $" + p.preco), x+10, y);
    
    if (!p.comprada) {
      let pode = moedas >= p.preco;
      fill(pode ? [34, 139, 34] : [150, 50, 50]);
      rect(width-160, y-12, 100, 28, 5);
      fill(255);
      textSize(12);
      textAlign(CENTER);
      text(pode ? "COMPRAR" : "SEM $", width-110, y+6);
    } else {
      fill([100, 100, 100]);
      rect(width-160, y-12, 100, 28, 5);
      fill(200);
      textSize(12);
      textAlign(CENTER);
      text("LIBERADA", width-110, y+6);
    }
    y += 35;
  }
  
  // Ajuda
  fill(150);
  textSize(12);
  textAlign(CENTER);
  text("Clique no item para comprar", width/2, height-30);
}

// ==================== FAZENDA ====================
function desenharFazenda() {
  background(30, 50, 30);
  
  // Céu
  fill(100, 180, 220);
  rect(0, 0, width, 80);
  fill(255, 220, 50);
  ellipse(60, 50, 40, 40);
  
  // Solo
  fill(60, 40, 20);
  rect(0, 80, width, height-80);
  
  // HUD
  fill(0, 0, 0, 180);
  rect(0, 0, width, 45);
  fill(0, 255, 136);
  textSize(16);
  textAlign(LEFT);
  text(`💰 ${moedas}`, 15, 30);
  fill(200);
  textSize(12);
  text("🌾 ESTUFA", width/2-40, 30);
  text("V = Voltar", width-100, 30);
  
  // Seleção de cultura
  let semente = sementesDisponiveis[culturaSelecionada];
  if (semente && semente.comprada) {
    fill(255, 220, 50);
    textSize(14);
    textAlign(RIGHT);
    text(culturasInfo[culturaSelecionada].nome + " (Z/X)", width-20, 60);
    fill(200);
    textSize(12);
    text("Estoque: " + semente.estoque, width-20, 80);
  }
  
  // Grade
  for (let i = 0; i < linhasFaz; i++) {
    for (let j = 0; j < colunasFaz; j++) {
      let x = j * celulaW;
      let y = offsetYFazenda + i * celulaH;
      fill(80, 60, 30);
      rect(x, y, celulaW-2, celulaH-2, 5);
      fill(100, 80, 40);
      rect(x+2, y+2, celulaW-6, celulaH-6, 3);
      
      if (fazendaGrid[i][j]) {
        let p = fazendaGrid[i][j];
        let info = culturasInfo[p.tipo];
        let progresso = p.crescimento / info.tempo;
        push();
        translate(x + celulaW/2, y + celulaH/2);
        info.desenho(progresso);
        pop();
        fill(50);
        rect(x+5, y+5, celulaW-20, 5);
        fill(0, 255, 100);
        rect(x+5, y+5, (celulaW-20)*progresso, 5);
        if (progresso >= 1) {
          fill(255, 220, 50, 100);
          ellipse(x+celulaW/2, y+celulaH/2, 30, 30);
        }
      }
    }
  }
  
  // Crescimento
  if (frameCount % 3 === 0) {
    let taxa = 0.5 + (karma > 0 ? 0.3 : 0);
    for (let i = 0; i < linhasFaz; i++) {
      for (let j = 0; j < colunasFaz; j++) {
        if (fazendaGrid[i][j]) {
          fazendaGrid[i][j].crescimento += taxa;
          let maxC = culturasInfo[fazendaGrid[i][j].tipo].tempo;
          if (fazendaGrid[i][j].crescimento > maxC) { fazendaGrid[i][j].crescimento = maxC; }
        }
      }
    }
  }
}

// ==================== JARDIM ====================
function desenharJardim() {
  if (!jardimLiberado) {
    modo = "CHALE";
    feedback("Compre uma planta mutante na Loja!", 60);
    return;
  }
  
  background(20, 25, 35);
  
  // Grade
  for (let linha = 0; linha < linhasPvZ; linha++) {
    for (let col = 0; col < colunasPvZ; col++) {
      let x = col * celPvZW;
      let y = offsetJardimY + linha * celPvZH;
      fill(col < colunasPlantaveis ? color(30, 60, 30) : color(50, 40, 50));
      stroke(0, 255, 136, 20);
      rect(x, y, celPvZW, celPvZH);
      noStroke();
    }
  }
  
  // Plantas
  for (let p of plantasPvZ) {
    let x = p.col * celPvZW + celPvZW/2;
    let y = offsetJardimY + p.linha * celPvZH + celPvZH/2;
    desenharPlantaPvZ(p, x, y);
  }
  
  // Zumbis
  for (let z of zumbisPvZ) {
    desenharZumbi(z);
  }
  
  // Projéteis
  for (let p of projeteis) {
    fill(0, 255, 100);
    ellipse(p.x, p.y, 6, 6);
  }
  
  // HUD
  fill(0, 0, 0, 180);
  rect(0, 0, width, 50);
  fill(0, 255, 136);
  textSize(14);
  textAlign(LEFT);
  text("☀️ " + sol + "  🌊 Wave " + wave, 15, 30);
  fill(200);
  text("🧟 " + zumbisRestantes + " restantes", 180, 30);
  text("V = Voltar", width-80, 30);
  
  // Menu de plantas
  let yMenu = 55;
  let plantasDisp = Object.keys(plantasDefesa).filter(id => plantasDefesa[id].comprada);
  if (plantasDisp.length > 0) {
    fill(150);
    textSize(11);
    textAlign(LEFT);
    text("1-" + plantasDisp.length + " selecionar:", 15, yMenu);
    for (let i = 0; i < plantasDisp.length; i++) {
      let id = plantasDisp[i];
      let p = plantasDefesa[id];
      let selecionado = plantaSelecionada === id;
      fill(selecionado ? [0, 255, 136] : [200, 200, 200]);
      text(p.nome + (selecionado ? " ✅" : ""), 15 + i * 100, yMenu);
    }
  } else {
    fill(200);
    textSize(12);
    text("Compre plantas na Loja (L)", 15, yMenu);
  }
  
  // Estado
  if (estadoJardim === "preparacao") {
    let seg = ceil(tempoPreparacao / 60);
    fill(255, 200, 100);
    textSize(16);
    textAlign(CENTER);
    text("⚔️ PRÓXIMA WAVE EM " + seg + "s", width/2, 30);
    fill(200);
    textSize(12);
    text("Plante suas defesas!", width/2, 48);
  }
  
  // Atualizar
  atualizarJardim();
}

// ==================== DESENHAR PLANTAS (NATURAIS) ====================
function desenharPlantaPvZ(p, x, y) {
  push();
  translate(x, y);
  
  if (p.tipo === "girassol") {
    fill(255, 220, 40);
    ellipse(0, 0, 35, 35);
    fill(255, 200, 20);
    for (let i = 0; i < 8; i++) {
      let ang = (i * TWO_PI) / 8;
      ellipse(cos(ang)*22, sin(ang)*22, 10, 10);
    }
    fill(60, 40, 20);
    ellipse(0, 0, 12, 12);
    
  } else if (p.tipo === "ervilha") {
    fill(60, 180, 60);
    ellipse(0, 0, 35, 35);
    fill(255, 200, 100);
    ellipse(10, -4, 8, 10);
    fill(200, 50, 50);
    ellipse(12, 4, 8, 6);
    fill(0);
    ellipse(-4, -7, 4, 4);
    ellipse(4, -7, 4, 4);
    
  } else if (p.tipo === "cogumelo") {
    fill(120, 80, 160);
    ellipse(0, 0, 35, 35);
    fill(140, 60, 180);
    arc(0, -6, 40, 30, PI, TWO_PI);
    fill(200, 100, 220);
    ellipse(-8, -10, 7, 7);
    ellipse(8, -10, 7, 7);
    fill(255);
    ellipse(-3, -3, 3, 3);
    ellipse(3, -3, 3, 3);
    
  } else if (p.tipo === "nozes") {
    fill(160, 120, 60);
    ellipse(0, 0, 40, 40);
    fill(140, 100, 50);
    ellipse(-7, -4, 13, 13);
    ellipse(7, -4, 13, 13);
    fill(80, 50, 20);
    ellipse(0, 0, 10, 10);
    
  } else if (p.tipo === "batataquente") {
    fill(180, 80, 20);
    ellipse(0, 0, 38, 38);
    fill(220, 60, 10);
    ellipse(-5, -3, 14, 14);
    ellipse(7, -3, 12, 12);
    fill(80, 40, 10);
    ellipse(0, 2, 10, 10);
    // Chamas
    let t = frameCount * 0.12;
    fill(255, 150, 0, 200);
    triangle(-7, -15, 0, -32 + sin(t)*3, 7, -15);
    fill(255, 80, 0, 180);
    triangle(-4, -13, 4, -26 + sin(t+1)*3, 10, -13);
    fill(255, 220, 0, 160);
    triangle(-10, -15, -3, -28 + sin(t+2)*3, 3, -15);
    // Olhos
    fill(255);
    ellipse(-7, -2, 7, 7);
    ellipse(7, -2, 7, 7);
    fill(200, 0, 0);
    ellipse(-7, -2, 3, 3);
    ellipse(7, -2, 3, 3);
    // Boca
    stroke(50, 0, 0);
    strokeWeight(2);
    line(-6, 8, -2, 11);
    line(-2, 11, 2, 11);
    line(2, 11, 6, 8);
    noStroke();
  }
  
  // Barra de vida
  fill(255, 0, 0);
  rect(-20, -28, 40, 4);
  fill(0, 255, 100);
  rect(-20, -28, 40 * (p.vida / p.vidaMax), 4);
  
  pop();
}

// ==================== DESENHAR ZUMBIS ====================
function desenharZumbi(z) {
  push();
  translate(z.x, z.y);
  
  fill(70, 85, 70);
  ellipse(0, 0, 35, 40);
  fill(100, 115, 100);
  ellipse(-10, -10, 14, 14);
  ellipse(10, -10, 14, 14);
  
  fill(0, 255, 136);
  ellipse(-12, -13, 6, 6);
  ellipse(12, -13, 6, 6);
  fill(0);
  ellipse(-12, -13, 2.5, 2.5);
  ellipse(12, -13, 2.5, 2.5);
  
  fill(60, 30, 30);
  arc(0, 3, 18, 12, 0, PI);
  fill(0, 255, 136);
  rect(-5, 0, 3, 5);
  rect(2, 0, 3, 5);
  
  // Tipo
  if (z.tipo === "cone") {
    fill(255, 100, 0);
    triangle(-12, -30, 12, -30, 0, -45);
  } else if (z.tipo === "balde") {
    fill(180, 180, 200);
    rect(-15, -38, 30, 18, 5);
  } else if (z.tipo === "zumbinho") {
    scale(0.7);
  } else if (z.tipo === "escudeiro") {
    fill(150, 150, 180);
    rect(-18, -8, 36, 28, 5);
  }
  
  // Barra de vida
  fill(255, 0, 0);
  rect(-20, -32, 40, 4);
  fill(0, 255, 100);
  rect(-20, -32, 40 * (z.vida / z.vidaMax), 4);
  
  // Fogo
  if (z.queimando) {
    fill(255, 100, 0, 200);
    textSize(14);
    text("🔥", 0, -38);
  }
  
  pop();
}

// ==================== LÓGICA DO JARDIM ====================
function atualizarJardim() {
  // Preparação
  if (estadoJardim === "preparacao") {
    tempoPreparacao--;
    if (tempoPreparacao <= 0) {
      estadoJardim = "combate";
      zumbisRestantes = 2 + wave * 1;
      zumbisMortosWave = 0;
      tempoProxZumbi = 0;
    }
    return;
  }
  
  // Combate
  // Spawn de zumbis
  if (zumbisRestantes > 0 && frameCount > tempoProxZumbi) {
    let linha = floor(random(linhasPvZ));
    let tipos = ["padrao"];
    if (wave >= 3) tipos.push("cone");
    if (wave >= 5) tipos.push("balde");
    if (wave >= 8) tipos.push("zumbinho");
    if (wave >= 12) tipos.push("escudeiro");
    let tipo = tipos[floor(random(tipos.length))];
    
    let vida = 40 + wave * 8;
    let dano = 8 + wave * 2;
    let vel = 0.5 + wave * 0.05;
    
    if (tipo === "cone") { vida *= 1.5; dano *= 1.2; }
    if (tipo === "balde") { vida *= 2; dano *= 1.3; vel *= 0.8; }
    if (tipo === "zumbinho") { vida *= 0.5; dano *= 0.7; vel *= 1.8; }
    if (tipo === "escudeiro") { vida *= 3; dano *= 1; vel *= 0.5; }
    
    let x = colunaSpawn * celPvZW + celPvZW/2;
    let y = offsetJardimY + linha * celPvZH + celPvZH/2;
    
    zumbisPvZ.push({
      x: x, y: y, linha: linha,
      vida: vida, vidaMax: vida,
      velocidade: vel,
      timerAtaque: 0,
      dano: dano,
      tipo: tipo,
      queimando: false
    });
    
    zumbisRestantes--;
    tempoProxZumbi = frameCount + 60 + random(30);
  }
  
  // Plantas atacam
  for (let p of plantasPvZ) {
    if (p.tipo === "girassol") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 200) {
        sol += 15 + (p.nivel || 0) * 5;
        p.timer = 0;
      }
    }
    
    if (p.tipo === "ervilha") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 25) {
        let alvo = zumbisPvZ.find(z => z.linha === p.linha);
        if (alvo) {
          projeteis.push({
            x: p.col * celPvZW + celPvZW/2 + 15,
            y: offsetJardimY + p.linha * celPvZH + celPvZH/2,
            linha: p.linha,
            dano: 15 + (p.nivel || 0) * 5
          });
          p.timer = 0;
        }
      }
    }
    
    if (p.tipo === "cogumelo") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 60) {
        let alvo = zumbisPvZ.find(z => z.linha === p.linha);
        if (alvo) {
          // Aplica lentidão
          alvo.velocidade *= 0.5;
          setTimeout(() => { alvo.velocidade *= 2; }, 3000);
          projeteis.push({
            x: p.col * celPvZW + celPvZW/2 + 15,
            y: offsetJardimY + p.linha * celPvZH + celPvZH/2,
            linha: p.linha,
            dano: 5
          });
          p.timer = 0;
        }
      }
    }
    
    if (p.tipo === "batataquente") {
      if (!p.timer) p.timer = 0;
      p.timer++;
      if (p.timer >= 200) {
        let alvo = zumbisPvZ.find(z => z.linha === p.linha);
        if (alvo) {
          projeteis.push({
            x: p.col * celPvZW + celPvZW/2 + 15,
            y: offsetJardimY + p.linha * celPvZH + celPvZH/2,
            linha: p.linha,
            dano: 30 + (p.nivel || 0) * 10,
            fogo: true
          });
          p.timer = 0;
        }
      }
    }
  }
  
  // Projéteis
  for (let i = projeteis.length - 1; i >= 0; i--) {
    let p = projeteis[i];
    p.x += 6;
    let hit = false;
    for (let z of zumbisPvZ) {
      if (z.linha === p.linha && abs(p.x - z.x) < 25 && abs(p.y - z.y) < 20) {
        z.vida -= p.dano;
        if (p.fogo) {
          z.queimando = true;
          z.vida -= 30;
          setTimeout(() => { z.queimando = false; }, 2000);
        }
        hit = true;
        break;
      }
    }
    if (hit || p.x > width) { projeteis.splice(i, 1); }
  }
  
  // Zumbis se movem
  for (let i = zumbisPvZ.length - 1; i >= 0; i--) {
    let z = zumbisPvZ[i];
    let bloqueado = false;
    
    // Verifica se tem planta na frente
    for (let p of plantasPvZ) {
      if (p.linha === z.linha) {
        let plantaX = p.col * celPvZW + celPvZW/2;
        if (abs(z.x - plantaX) < 30) {
          bloqueado = true;
          if (z.timerAtaque <= 0) {
            p.vida -= z.dano;
            z.timerAtaque = 20;
            if (p.vida <= 0) {
              let idx = plantasPvZ.indexOf(p);
              if (idx > -1) { plantasPvZ.splice(idx, 1); }
            }
          }
          break;
        }
      }
    }
    
    if (!bloqueado) {
      z.x -= z.velocidade;
    }
    
    if (z.timerAtaque > 0) { z.timerAtaque--; }
    
    // Fogo contínuo
    if (z.queimando) {
      z.vida -= 1;
    }
    
    // Morte
    if (z.vida <= 0) {
      zumbisPvZ.splice(i, 1);
      zumbisMortosWave++;
      moedas += 5 + wave * 2;
    }
  }
  
  // Fim da wave
  if (zumbisPvZ.length === 0 && zumbisRestantes === 0 && zumbisMortosWave > 0) {
    wave++;
    estadoJardim = "preparacao";
    tempoPreparacao = 200;
    sol += 30;
    moedas += 20 + wave * 5;
    feedback("🌊 Wave " + (wave-1) + " completa! +" + (20 + wave * 5) + " moedas", 60);
  }
}

// ==================== FUNÇÕES DAS CULTURAS (NATURAIS) ====================
function desenharMilho(progresso) {
  let tam = 15 + progresso * 20;
  push();
  fill(60, 120, 40);
  rect(-2, 0, 4, tam * 0.6, 2);
  fill(80, 160, 60);
  triangle(-3, tam*0.1, -tam*0.4, -tam*0.1, -3, -tam*0.15);
  triangle( 3, tam*0.15, tam*0.4, -tam*0.05, 3, -tam*0.1);
  if (progresso > 0.4) {
    fill(245, 215, 50);
    rect(-tam*0.15, -tam*0.6, tam*0.3, tam*0.5, 2);
    fill(255, 230, 60);
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        ellipse(-tam*0.08 + col*tam*0.08, -tam*0.55 + row*tam*0.2, 4, 4);
      }
    }
  }
  pop();
}

function desenharCenoura(progresso) {
  let tam = 12 + progresso * 18;
  push();
  fill(230, 126, 34);
  ellipse(0, 0, tam, tam);
  stroke(180, 80, 20);
  strokeWeight(2);
  line(-tam/3, 0, tam/3, 0);
  fill(50, 150, 50);
  noStroke();
  triangle(-tam/4, -tam/2, 0, -tam, tam/4, -tam/2);
  pop();
}

function desenharBatata(progresso) {
  let tam = 12 + progresso * 18;
  push();
  fill(205, 133, 63);
  ellipse(0, 0, tam, tam);
  fill(139, 69, 19);
  for (let i = 0; i < 4; i++) {
    ellipse(random(-tam/3, tam/3), random(-tam/3, tam/3), 2, 2);
  }
  pop();
}

function desenharTomate(progresso) {
  let tam = 12 + progresso * 18;
  push();
  fill(231, 76, 60);
  ellipse(0, 0, tam, tam);
  fill(50, 150, 50);
  ellipse(0, -tam/2, 6, 10);
  line(0, -tam/2, -4, -tam/1.5);
  line(0, -tam/2,  4, -tam/1.5);
  pop();
}

function desenharSoja(progresso) {
  let tam = 12 + progresso * 18;
  push();
  fill(100, 180, 100);
  ellipse(0, 0, tam, tam);
  fill(80, 130, 80);
  ellipse(-tam/6, -tam/6, 4, 4);
  ellipse( tam/6, -tam/6, 4, 4);
  ellipse(0,      tam/6, 4, 4);
  pop();
}

// ==================== FEEDBACK ====================
function feedback(msg, tempo) {
  feedbackMsg = msg;
  tempoFeedback = tempo;
}

function atualizarFeedback() {
  if (tempoFeedback > 0) {
    tempoFeedback--;
    fill(0, 0, 0, 200);
    rect(width/2-200, height-60, 400, 35, 8);
    fill(0, 255, 136);
    textAlign(CENTER);
    textSize(14);
    text(feedbackMsg, width/2, height-38);
  }
}

// ==================== EVENTOS ====================
function keyPressed() {
  // Fechar loja
  if (telaLojaAberta) {
    if (key === 'e' || key === 'E' || key === 'Escape') {
      telaLojaAberta = false;
    }
    return;
  }
  
  // Loja (L)
  if (key === 'l' || key === 'L') {
    telaLojaAberta = true;
    return;
  }
  
  // Voltar (V)
  if (key === 'v' || key === 'V') {
    if (modo !== "CHALE") {
      modo = "CHALE";
      document.getElementById('hint-text').textContent = '🎮 WASD = Mover · E = Interagir · Clique = Plantar/Colher';
    }
    return;
  }
  
  // Interagir (E) - no chalé
  if (modo === "CHALE" && (key === 'e' || key === 'E')) {
    let rectJogador = { x: jogadorX-15, y: jogadorY-15, w: 30, h: 30 };
    for (let obj of objetosChale) {
      if (colide(rectJogador, obj)) {
        if (obj.tipo === "porta") {
          if (obj.destino === "PVZ" && !jardimLiberado) {
            feedback("Compre uma planta mutante na Loja (L)!", 60);
            return;
          }
          modo = obj.destino;
          if (modo === "PVZ") { resetarJardim(); }
          document.getElementById('hint-text').textContent = '🌱 Clique para plantar · 1-5 selecionar · V = Voltar';
        } else if (obj.tipo === "pc") {
          telaLojaAberta = true;
        }
        break;
      }
    }
    return;
  }
  
  // Seleção de cultura (Z/X) - fazenda
  if (modo === "FAZENDA") {
    let culturas = Object.keys(culturasInfo);
    if (key === 'z' || key === 'Z') {
      let idx = culturas.indexOf(culturaSelecionada);
      idx = (idx + 1) % culturas.length;
      culturaSelecionada = culturas[idx];
    }
    if (key === 'x' || key === 'X') {
      let idx = culturas.indexOf(culturaSelecionada);
      idx = (idx - 1 + culturas.length) % culturas.length;
      culturaSelecionada = culturas[idx];
    }
  }
  
  // Seleção de planta (1-5) - jardim
  if (modo === "PVZ") {
    let plantasDisp = Object.keys(plantasDefesa).filter(id => plantasDefesa[id].comprada);
    for (let i = 0; i < plantasDisp.length && i < 5; i++) {
      if (key === String(i+1)) {
        plantaSelecionada = plantasDisp[i];
        feedback("✅ " + plantasDefesa[plantaSelecionada].nome + " selecionada", 30);
      }
    }
  }
}

function mousePressed() {
  // Loja
  if (telaLojaAberta) {
    // Fechar
    if (mouseX > width-70 && mouseX < width-20 && mouseY > 20 && mouseY < 50) {
      telaLojaAberta = false;
      return;
    }
    
    // Comprar sementes
    let y = 130;
    for (let [id, s] of Object.entries(sementesDisponiveis)) {
      if (!s.comprada) { y += 35; continue; }
      let botaoX = width-160;
      if (mouseX > botaoX && mouseX < botaoX+100 && mouseY > y-12 && mouseY < y+16) {
        if (moedas >= s.preco && s.estoque < 20) {
          moedas -= s.preco;
          s.estoque++;
          feedback("✅ Comprou " + s.nome, 30);
        } else if (s.estoque >= 20) {
          feedback("❌ Estoque cheio!", 30);
        } else {
          feedback("❌ Sem créditos!", 30);
        }
        return;
      }
      y += 35;
    }
    
    // Comprar plantas defensivas
    y += 30;
    for (let [id, p] of Object.entries(plantasDefesa)) {
      if (p.comprada) { y += 35; continue; }
      let botaoX = width-160;
      if (mouseX > botaoX && mouseX < botaoX+100 && mouseY > y-12 && mouseY < y+16) {
        if (moedas >= p.preco) {
          moedas -= p.preco;
          p.comprada = true;
          jardimLiberado = true;
          feedback("✅ " + p.nome + " desbloqueada! Acesse o LAB!", 60);
        } else {
          feedback("❌ Sem créditos!", 30);
        }
        return;
      }
      y += 35;
    }
    return;
  }
  
  // Fazenda - plantar/colher
  if (modo === "FAZENDA") {
    for (let i = 0; i < linhasFaz; i++) {
      for (let j = 0; j < colunasFaz; j++) {
        let x = j * celulaW;
        let y = offsetYFazenda + i * celulaH;
        if (mouseX > x && mouseX < x+celulaW && mouseY > y && mouseY < y+celulaH) {
          if (fazendaGrid[i][j]) {
            // Colher
            let p = fazendaGrid[i][j];
            if (p.crescimento >= culturasInfo[p.tipo].tempo) {
              let valor = culturasInfo[p.tipo].venda;
              moedas += valor;
              fazendaGrid[i][j] = null;
              feedback("💰 +" + valor + " moedas", 30);
            } else {
              feedback("⏳ Ainda não cresceu!", 30);
            }
          } else {
            // Plantar
            let s = sementesDisponiveis[culturaSelecionada];
            if (s && s.comprada && s.estoque > 0) {
              fazendaGrid[i][j] = { tipo: culturaSelecionada, crescimento: 0 };
              s.estoque--;
              feedback("🌱 Plantou " + culturasInfo[culturaSelecionada].nome, 30);
            } else {
              feedback("❌ Sem sementes!", 30);
            }
          }
          return;
        }
      }
    }
  }
  
  // Jardim - plantar
  if (modo === "PVZ" && estadoJardim === "preparacao") {
    let col = floor(mouseX / celPvZW);
    let linha = floor((mouseY - offsetJardimY) / celPvZH);
    if (col >= 0 && col < colunasPlantaveis && linha >= 0 && linha < linhasPvZ) {
      if (plantaSelecionada && plantasDefesa[plantaSelecionada] && plantasDefesa[plantaSelecionada].comprada) {
        let ocupado = plantasPvZ.some(p => p.linha === linha && p.col === col);
        if (!ocupado && sol >= plantasDefesa[plantaSelecionada].custoSol) {
          let p = plantasDefesa[plantaSelecionada];
          let vida = 50;
          if (plantaSelecionada === "nozes") vida = 200;
          if (plantaSelecionada === "batataquente") vida = 60;
          plantasPvZ.push({
            tipo: plantaSelecionada,
            linha: linha,
            col: col,
            vida: vida,
            vidaMax: vida,
            timer: 0,
            nivel: 0
          });
          sol -= p.custoSol;
          feedback("✅ " + p.nome + " plantada!", 30);
        } else if (ocupado) {
          feedback("❌ Local ocupado!", 30);
        } else {
          feedback("☀️ Sol insuficiente!", 30);
        }
      } else {
        feedback("❌ Selecione uma planta (1-5)", 30);
      }
    }
  }
}

function colide(r1, r2) {
  return r1.x < r2.x+r2.w && r1.x+r1.w > r2.x && 
         r1.y < r2.y+r2.h && r1.y+r1.h > r2.y;
}
